<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kidsland: программирование для детей</title>
    <link rel="icon" href="/favicon.svg" />
    <script>
      try {
        document.documentElement.dataset.theme = 'dark';
        var l = localStorage.getItem('kidsland.lang');
        if (l === 'en' || l === 'el' || l === 'he') document.documentElement.lang = l;
        if (l === 'he') document.documentElement.dir = 'rtl';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700;800&family=Nunito:wght@400;600;800;900&family=Rubik:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
