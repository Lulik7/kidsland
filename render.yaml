# Render Blueprint, free variant: the whole site (server + built client) in one free Docker service.
# The database is a free Neon Postgres (neon.tech); paste its connection string as DATABASE_URL.
# Free services sleep after 15 minutes without visitors and have no disk: uploaded videos and documents
# disappear on every restart or redeploy, until a disk or file storage is added.
# Render dashboard → New → Blueprint → pick this repository. Values marked sync: false are asked on the first deploy.
services:
  - type: web
    name: kidsland
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      # Neon connection string, like postgresql://user:password@ep-....neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_TUTORS
        value: "true"
      # Your email: whoever registers with it becomes the admin.
      - key: ADMIN_EMAILS
        sync: false
      # Address of the site, e.g. https://kidsland.onrender.com (later your own domain).
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Gmail for letters: smtps://you%40gmail.com:APP-PASSWORD@smtp.gmail.com:465
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
